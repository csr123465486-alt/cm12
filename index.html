<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주식회사 씨엠 | CM Co., Ltd.</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 메인 화면 전용 스타일 */
    body { overflow: hidden; } /* 메인은 스크롤 없음 */
    .hero-section { position: relative; width: 100vw; height: 100vh; }
    .hero-media { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    .hero-media video { width: 100%; height: 100%; object-fit: cover; }
    
    /* 영상이 더 맑게 보이도록 오버레이 투명도 30% 유지 */
    .hero-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.3); z-index: 2; pointer-events: none; }
    
    .hero-content { position: relative; z-index: 3; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .hero-logo-mark img { max-width: 280px; width: 100%; height: auto; filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5)); animation: fadeIn 1.5s ease-out forwards; border-radius: 10px; cursor: pointer; }
    .hero-text-anim { color: #fff; margin-top: 20px; animation: fadeIn 2s ease-out forwards; }
    .hero-text-anim h2 { font-size: 2.8rem; font-weight: 800; margin-bottom: 15px; text-shadow: 0 4px 15px rgba(0,0,0,0.8); }
    .hero-text-anim p { font-size: 1.25rem; text-shadow: 0 2px 5px rgba(0,0,0,0.8); line-height: 1.6; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand">
        <img src="https://i.imgur.com/XkPSCm5.png" alt="주식회사 씨엠 로고" class="brand-logo-img">
        <span class="brand-copy"><strong>주식회사 씨엠</strong><em>CM Co., Ltd.</em></span>
      </a>
      <nav class="site-nav">
        <div class="nav-item"><a href="about.html">회사소개</a></div>
        <div class="nav-item"><a href="product.html">제품소개</a></div>
        <div class="nav-item"><a href="industry.html">적용산업</a></div>
        <div class="nav-item"><a href="contents.html">컨텐츠</a></div>
      </nav>
    </div>
  </header>

  <section class="hero-section">
    <div class="hero-media">
      <video src="0313.mp4" autoplay loop muted playsinline></video>
    </div>
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <a href="about.html" class="hero-logo-mark">
        <img src="https://i.imgur.com/pm9J4PI.gif" alt="CM Main GIF Logo">
      </a>
      <div class="hero-text-anim">
        <h2>기계시스템의 고장 진단</h2>
        <p>기계시스템의 유지보수는 고장 대응형에서 고장 예측형으로,<br>예방 조치에서 예지 보전으로 발전하고 있습니다.</p>
      </div>
    </div>
  </section>

</body>
</html>
