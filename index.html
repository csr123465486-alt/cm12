<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주식회사 씨엠 | CM Co., Ltd.</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 메인 화면 전용 스타일 */
    body { overflow: hidden; } /* 메인은 스크롤 없음 */
    .hero-section { position: relative; width: 100vw; height: 100vh; }
    .hero-media { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    .hero-media video { width: 100%; height: 100%; object-fit: cover; }
    
    /* 🔥 [핵심 추가] 모바일에서 자동재생이 막혔을 때 뜨는 '거대 재생 버튼' 강제로 숨기기 */
    video::-webkit-media-controls { display: none !important; }
    video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none !important; }
    
    .hero-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.3); z-index: 2; pointer-events: none; }
    
    .hero-content { position: relative; z-index: 3; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .hero-logo-mark img { max-width: 280px; width: 100%; height: auto; filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5)); animation: fadeIn 1.5s ease-out forwards; border-radius: 10px; cursor: pointer; }
    .hero-text-anim { color: #fff; margin-top: 20px; animation: fadeIn 2s ease-out forwards; }
    .hero-text-anim h2 { font-size: 2.8rem; font-weight: 800; margin-bottom: 15px; text-shadow: 0 4px 15px rgba(0,0,0,0.8); }
    .hero-text-anim p { font-size: 1.25rem; text-shadow: 0 2px 5px rgba(0,0,0,0.8); line-height: 1.6; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 모바일 글자 크기 조정 */
    @media (max-width: 768px) {
      .hero-text-anim h2 { font-size: 2rem; }
      .hero-text-anim p { font-size: 1rem; word-break: keep-all; padding: 0 20px; }
    }
  </style>
</head>
<body>
  
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand">
        <img src="https://i.imgur.com/XkPSCm5.png" alt="주식회사 씨엠 로고" class="brand-logo-img">
        <span class="brand-copy"><strong>주식회사 씨엠</strong><em>CM Co., Ltd.</em></span>
      </a>

      <button class="menu-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>

      <nav class="site-nav">
        <div class="nav-item"><a href="about.html">회사소개</a></div>
        <div class="nav-item"><a href="product.html">제품소개</a></div>
        <div class="nav-item"><a href="industry.html">적용산업</a></div>
        <div class="nav-item"><a href="contents.html">컨텐츠</a></div>
      </nav>
    </div>
  </header>

  <section class="hero-section">
    <div class="hero-media">
      <video id="bg-video" src="0313.mp4" autoplay loop muted playsinline webkit-playsinline></video>
    </div>
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <a href="about.html" class="hero-logo-mark">
        <img src="https://i.imgur.com/pm9J4PI.gif" alt="CM Main GIF Logo">
      </a>
      <div class="hero-text-anim">
        <h2>기계시스템의 고장 진단</h2>
        <p>기계시스템의 유지보수는 고장 대응형에서 고장 예측형으로,<br>예방 조치에서 예지 보전으로 발전하고 있습니다.</p>
      </div>
    </div>
  </section>

  <script>
    // 1. 모바일 햄버거 메뉴 동작
    const menuToggleBtn = document.querySelector('.menu-toggle');
    const navMenu = document.querySelector('.site-nav');
    if(menuToggleBtn && navMenu) {
      menuToggleBtn.addEventListener('click', function() {
        navMenu.classList.toggle('active');
      });
    }

    // 2. 모바일 비디오 자동재생 강제 우회 스크립트
    document.addEventListener("DOMContentLoaded", function() {
      const video = document.getElementById('bg-video');
      if (video) {
        // 영상 소리를 끈 상태로 명시하여 브라우저 허가 유도
        video.muted = true;
        
        let playPromise = video.play();
        
        if (playPromise !== undefined) {
          playPromise.then(() => {
            // 정상적으로 자동 재생됨
          }).catch(error => {
            // 절전 모드 등으로 자동재생이 차단되었을 때, 
            // 화면 아무 곳이나 한 번 터치하면 바로 재생되도록 셋팅
            console.log("모바일 절전모드로 인한 영상 차단. 터치 대기중...");
            document.body.addEventListener('touchstart', function() {
              video.play();
            }, { once: true });
          });
        }
      }
    });
 <script>
    const menuToggleBtn = document.querySelector('.menu-toggle');
    const navMenu = document.querySelector('.site-nav');
    if(menuToggleBtn && navMenu) {
      menuToggleBtn.addEventListener('click', function() {
        navMenu.classList.toggle('active');
      });
    }
  </script>
</body>
</html>
