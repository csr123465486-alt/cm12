<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주식회사 씨엠 | CM Co., Ltd.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand">
        <img src="https://i.imgur.com/XkPSCm5.png" alt="주식회사 씨엠 로고" class="brand-logo-img">
        <span class="brand-copy"><strong>주식회사 씨엠</strong><em>CM Co., Ltd.</em></span>
      </a>
      <button class="menu-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav">
        <div class="nav-item"><a href="about.html">회사소개</a></div>
        <div class="nav-item"><a href="product.html">제품소개</a></div>
        <div class="nav-item"><a href="industry.html">적용산업</a></div>
        <div class="nav-item"><a href="contents.html">컨텐츠</a></div>
      </nav>
    </div>
  </header>

  <section class="hero-section">
    <div class="hero-media">
      <video id="bg-video" src="0313.mp4" 
             autoplay="autoplay" loop="loop" muted="muted" 
             playsinline="playsinline" webkit-playsinline="webkit-playsinline" 
             disablePictureInPicture disableRemotePlayback></video>
    </div>
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <a href="about.html" class="hero-logo-mark">
        <img src="https://i.imgur.com/pm9J4PI.gif" alt="CM Main GIF Logo">
      </a>
      <div class="hero-text-anim">
        <h2>기계시스템의 고장 진단</h2>
        <p>기계시스템의 유지보수는 고장 대응형에서 고장 예측형으로,<br>예방 조치에서 예지 보전으로 발전하고 있습니다.</p>
      </div>
    </div>
  </section>

  <script>
    // 1. 모바일 햄버거 메뉴 동작
    const menuToggleBtn = document.querySelector('.menu-toggle');
    const navMenu = document.querySelector('.site-nav');
    if(menuToggleBtn && navMenu) {
      menuToggleBtn.addEventListener('click', function(e) {
        navMenu.classList.toggle('active');
        e.stopPropagation();
      });
    }

    // 2. 비디오 강제 자동재생 스크립트
    document.addEventListener("DOMContentLoaded", function() {
      const video = document.getElementById('bg-video');
      if (video) {
        video.muted = true;
        video.setAttribute('muted', '');
        let playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            document.body.addEventListener('touchstart', function() { video.play(); }, { once: true });
          });
        }
      }
    });
  </script>
</body>
</html>
